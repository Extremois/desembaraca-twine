[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twine-edge-overlap"
version = "0.1.0.dev0"
description = "Ferramenta em desenvolvimento para melhorar layouts de grafos do Twine."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
twine-edge-overlap = "twine_edge_overlap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["twine_edge_overlap*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

