name: macOS evidence (manual, GitHub hosted architectures)
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: GitHub hosted runner architecture
        required: true
        type: choice
        options: [x86_64, aarch64]
      application_revision:
        description: Pinned application commit present in candidate
        required: true
        type: string
      candidate_run_id:
        description: Existing signed candidate workflow run
        required: true
        type: string
      candidate_name:
        description: Immutable artifact containing exactly one wheel
        required: true
        type: string
      package_sha256:
        description: SHA-256 of the exact wheel
        required: true
        type: string
      artifact_id:
        description: Signed and notarized descriptor ID in candidate
        required: true
        type: string
      image_id:
        description: Recorded GitHub Actions macOS runner ID
        required: true
        type: string
      image_digest:
        description: SHA-256 of the recorded reference environment
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  cell:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    uses: ./.github/workflows/qualify-cell.yml
    with:
      runner_os: macOS
      runner_label: ${{ inputs.architecture == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
      arch: ${{ inputs.architecture }}
      python_minor: ${{ matrix.python }}
      application_revision: ${{ inputs.application_revision }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      candidate_name: ${{ inputs.candidate_name }}
      package_sha256: ${{ inputs.package_sha256 }}
      artifact_id: ${{ inputs.artifact_id }}
      image_id: ${{ inputs.image_id }}
      image_digest: ${{ inputs.image_digest }}
