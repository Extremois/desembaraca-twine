name: Documented remote installation
on:
  push:
    branches: [feat/003-add-cross-platform-support]
    paths:
      - '.github/workflows/documented-installation.yml'
      - 'tools/validation/check-installation-docs.py'
      - 'README.md'
      - 'specs/003-add-cross-platform-support/quickstart.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documented-installation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  remote-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install immutable archive with no Git or Graphviz on PATH
        env:
          PYTHONUTF8: '1'
        run: python tools/validation/check-installation-docs.py --work "${{ runner.temp }}/documented-installation" --report "${{ runner.temp }}/documented-installation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: documented-installation-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/documented-installation.json
          retention-days: 7
