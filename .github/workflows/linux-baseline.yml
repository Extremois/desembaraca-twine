name: Ubuntu 18.04 native kernel engine baseline
on:
  workflow_dispatch:
  push:
    branches: [feat/003-add-cross-platform-support]
    paths:
      - '.github/workflows/linux-baseline.yml'
      - '.github/scripts/check-native-baseline.py'
      - '.github/scripts/probe-guest-baseline.py'
      - '.github/native-images/ubuntu-18.04-amd64.json'
      - 'tests/unit/test_native_baseline.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: native-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ubuntu1804-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39434565632
          name: linux-glibc-x86_64-unqualified-b13cd6f90db31163e62119bb83e2eb8db5ac8458
          path: ${{ runner.temp }}/baseline-artifact
      - name: Prepare byte-bound engine and public geometry inputs
        shell: bash
        run: python .github/scripts/check-native-baseline.py --artifact "$RUNNER_TEMP/baseline-artifact" --work "$RUNNER_TEMP/twine-native-baseline"
      - name: Install guest test tooling only on this ephemeral runner
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Boot pinned Ubuntu 18.04 using KVM and test the unchanged engine
        shell: bash
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_SHA python3 .github/scripts/check-native-baseline.py --execute --work "$RUNNER_TEMP/twine-native-baseline"
      - name: Retain baseline measurements without disks or SSH credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu1804-x64-engine-baseline-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/twine-native-baseline/evidence/*.json
            ${{ runner.temp }}/twine-native-baseline/evidence/*.log
            ${{ runner.temp }}/twine-native-baseline/evidence/guest/*.json
            ${{ runner.temp }}/twine-native-baseline/evidence/guest/*.txt
