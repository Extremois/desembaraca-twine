name: User command installation without activation
on:
  push:
    branches: [feat/003-add-cross-platform-support]
    paths:
      - 'install.py'
      - 'tools/validation/check-user-install.py'
      - '.github/workflows/user-installation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the application wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "${{ runner.temp }}/installer-dist"
      - name: Install twice in a disposable profile and run without activation
        shell: bash
        run: |
          wheel=("${{ runner.temp }}"/installer-dist/*.whl)
          python tools/validation/check-user-install.py --wheel "${wheel[0]}" --report "${{ runner.temp }}/user-install.json"
      - uses: actions/upload-artifact@v4
        with:
          name: user-install-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/user-install.json
