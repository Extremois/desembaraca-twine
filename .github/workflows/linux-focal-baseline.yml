name: Ubuntu 20.04 native kernel and installed application
on:
  workflow_dispatch:
  push:
    branches: [feat/003-add-cross-platform-support]
    paths:
      - '.github/workflows/linux-focal-baseline.yml'
      - '.github/scripts/check-native-baseline.py'
      - '.github/scripts/probe-guest-baseline.py'
      - '.github/scripts/probe-private-python.py'
      - '.github/scripts/probe-installed-application.py'
      - '.github/scripts/probe-installed-recovery.py'
      - '.github/native-images/ubuntu-20.04-amd64.json'
      - '.github/native-images/private-python-x64.json'
      - 'tests/unit/test_native_baseline.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: native-focal-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ubuntu2004-x64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: glibc
            python_args: --python-prerequisites --python-application
            candidate_run: 40565098269
            candidate_name: linux-glibc-x86_64-unqualified-a825f0d80bd7892de0e307656d28070885a9d1ed
          - abi: musl
            python_args: ''
            candidate_run: 40565098367
            candidate_name: linux-musl-x86_64-container-unqualified-a825f0d80bd7892de0e307656d28070885a9d1ed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.candidate_run }}
          name: ${{ matrix.candidate_name }}
          path: ${{ runner.temp }}/baseline-artifact
      - name: Prepare reviewed engine, public corpus and isolated Python inputs
        shell: bash
        run: python .github/scripts/check-native-baseline.py --artifact "$RUNNER_TEMP/baseline-artifact" --work "$RUNNER_TEMP/twine-native-focal" --release 20.04 --abi '${{ matrix.abi }}' --candidate-revision a825f0d80bd7892de0e307656d28070885a9d1ed --candidate-run-id '${{ matrix.candidate_run }}' ${{ matrix.python_args }}
      - name: Install guest test tooling only on this ephemeral runner
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Boot the pinned Ubuntu 20.04 image using KVM and test offline
        shell: bash
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_SHA python3 .github/scripts/check-native-baseline.py --execute --release 20.04 --work "$RUNNER_TEMP/twine-native-focal"
      - name: Retain measurements without guest disks, keys or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu2004-x64-${{ matrix.abi }}-native-private-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/twine-native-focal/evidence/*.json
            ${{ runner.temp }}/twine-native-focal/evidence/*.log
            ${{ runner.temp }}/twine-native-focal/evidence/guest/*.json
            ${{ runner.temp }}/twine-native-focal/evidence/guest/*.txt
            ${{ runner.temp }}/twine-native-focal/evidence/application/*.json
            ${{ runner.temp }}/twine-native-focal/evidence/application/*.trace
