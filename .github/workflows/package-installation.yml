name: Current wheel and sdist installation
on:
  workflow_dispatch:
  push:
    branches: [feat/003-add-cross-platform-support]
    paths:
      - '.github/workflows/package-installation.yml'
      - 'tools/validation/check-built-packages.py'
      - 'tests/unit/test_built_packages.py'
      - 'src/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'LICENSE'
      - 'NOTICE'
permissions:
  contents: read
concurrency:
  group: package-installation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    name: Packages (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare build frontend on this ephemeral runner
        run: python -m pip install build
      - name: Build current source distribution and wheel
        run: python -m build --outdir "${{ runner.temp }}/current-packages"
      - name: Obtain private offline backend wheels
        run: >-
          python -m pip download --only-binary=:all: --no-deps
          --dest "${{ runner.temp }}/package-wheelhouse" setuptools wheel packaging
      - name: Install both formats outside checkout with restricted PATH and no index
        run: python tools/validation/check-built-packages.py --dist-dir "${{ runner.temp }}/current-packages" --wheelhouse "${{ runner.temp }}/package-wheelhouse" --report "${{ runner.temp }}/package-installation.json"
      - name: Preserve content-bound installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          retention-days: 7
          path: ${{ runner.temp }}/package-installation.json
